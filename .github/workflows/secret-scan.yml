name: Secret Scan

# 鍵・証明書・.env 系の秘匿ファイルが Git に追跡されていないかを検査する。
# .gitignore は未追跡ファイルにしか効かず、一度 push した秘匿ファイルは履歴に残る（対処はローテーションのみ）。
# そのため「追跡された時点で落とす」検出を CI に持たせる。判定ロジックは scripts/check-secret-files.sh に集約。
# どの種類の変更でも混入しうるうえ、必須チェックにした場合に起動しない PR が pending のまま止まるため、paths フィルタを付けない。
on:
    pull_request:
    push:
        branches:
            - main

# 検査のみでリポジトリへ書き込まないため、読み取り権限に絞る
permissions:
    contents: read

jobs:
    secret-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # 判定ロジック自体が壊れていないことを先に確かめる（除外漏れ・fail-open の検知）
            - name: Test secret file classifier
              run: bash scripts/check-secret-files.test.sh

            - name: Assert no secret files are tracked
              run: bash scripts/check-secret-files.sh
